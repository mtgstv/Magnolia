# Perfil "dev": valores para rodar no seu computador com o docker compose.
# Nada aqui é secreto de verdade; em produção esses valores vêm de variáveis de ambiente.
spring.datasource.url=jdbc:postgresql://localhost:5433/magnolia
spring.datasource.username=magnolia
spring.datasource.password=magnolia123

# Estrutura do banco + perfumes e promoções de exemplo
spring.flyway.locations=classpath:db/migration,classpath:db/exemplo

app.cors.allowed-origins=http://localhost:5173

app.auth.segredo-jwt=segredo-de-desenvolvimento-da-magnolia-so-vale-no-perfil-dev
# Sem HTTPS no localhost: com true o navegador não guardaria o cookie
app.auth.cookie-seguro=false
