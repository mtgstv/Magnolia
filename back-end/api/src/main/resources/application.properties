spring.application.name=api

# Este arquivo vale para produção: os valores secretos vêm de variáveis de ambiente e não têm valor padrão,
# então a API nem inicia se alguma estiver faltando. Para rodar no seu computador, use o perfil "dev"
# (application-dev.properties), que o ./mvnw spring-boot:run já liga sozinho (ver pom.xml).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_SENHA}

# Todas as rotas da API ficam em /api/v1 (igual ao VITE_API_URL do front-end)
server.servlet.context-path=/api/v1

# Quem cria as tabelas é o Flyway; o Hibernate só confere se as entidades batem com o banco
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Carrega variantes e imagens de vários produtos de uma vez, em vez de uma consulta por produto
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Só a estrutura do banco; os perfumes de exemplo (db/exemplo) entram apenas no perfil dev
spring.flyway.locations=classpath:db/migration

# Origens que podem chamar a API pelo navegador (separe várias com vírgula), ex.: https://www.magnolia.com.br
app.cors.allowed-origins=${APP_CORS_ORIGENS}

# Login: JWT em cookie HttpOnly (ver config/AuthProperties)
# APP_AUTH_SEGREDO_JWT: valor aleatório e secreto com pelo menos 32 caracteres
app.auth.segredo-jwt=${APP_AUTH_SEGREDO_JWT}
app.auth.duracao-acesso=15m
app.auth.duracao-renovacao=7d
# Em produção o site usa HTTPS, então o cookie só pode viajar por conexão segura
app.auth.cookie-seguro=true
# Login e cadastro: no máximo 10 tentativas por minuto vindas do mesmo IP
app.auth.limite-tentativas=10
app.auth.janela-tentativas=1m
