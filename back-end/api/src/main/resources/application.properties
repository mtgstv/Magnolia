spring.application.name=api
spring.datasource.url=jdbc:postgresql://localhost:5433/magnolia
spring.datasource.username=magnolia
spring.datasource.password=magnolia123

# Todas as rotas da API ficam em /api/v1 (igual ao VITE_API_URL do front-end)
server.servlet.context-path=/api/v1

# Quem cria as tabelas é o Flyway; o Hibernate só confere se as entidades batem com o banco
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Carrega variantes e imagens de vários produtos de uma vez, em vez de uma consulta por produto
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# db/exemplo tem perfumes e promoções de exemplo; em produção, deixe só classpath:db/migration
spring.flyway.locations=classpath:db/migration,classpath:db/exemplo

# Origens que podem chamar a API pelo navegador (separe várias com vírgula)
app.cors.allowed-origins=http://localhost:5173

# Login: JWT em cookie HttpOnly (ver config/AuthProperties)
# Em produção, defina a variável de ambiente APP_AUTH_SEGREDO_JWT com um valor aleatório e secreto
app.auth.segredo-jwt=${APP_AUTH_SEGREDO_JWT:segredo-de-desenvolvimento-da-magnolia-troque-em-producao}
app.auth.duracao-acesso=15m
app.auth.duracao-renovacao=7d
app.auth.cookie-seguro=false
