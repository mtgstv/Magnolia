services:
  db:
    image: postgres:17
    container_name: magnolia-db
    environment:
      POSTGRES_DB: magnolia
      POSTGRES_USER: magnolia
      POSTGRES_PASSWORD: magnolia123
    ports:
      # 127.0.0.1: só este computador acessa o banco (sem isso, qualquer aparelho da rede Wi-Fi conseguiria)
      - "127.0.0.1:5433:5432"
    volumes:
      - magnolia-data:/var/lib/postgresql/data

volumes:
  magnolia-data: